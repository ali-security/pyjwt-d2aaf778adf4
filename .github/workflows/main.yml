---
name: CI

on:
  workflow_dispatch:
    inputs:
      test-filter:
        description: "Optional test selector passed to tox posargs"
        required: false
        type: string
        default: ""

jobs:
  tests:
    name: "Python ${{ matrix.python-version }} on ${{ matrix.platform }}"
    runs-on: "${{ matrix.platform }}"
    timeout-minutes: 30
    env:
      USING_COVERAGE: '3.9'

    strategy:
      fail-fast: false
      matrix:
        platform: ["ubuntu-latest", "windows-latest"]
        python-version:
          - "3.9"
          - "3.10"
          - "3.11"
          - "3.12"
          - "3.13"
          - "3.14"
          - "pypy3.9"
          - "pypy3.10"
          - "pypy3.11"

    steps:
      - uses: "actions/checkout@v6"
      - uses: "actions/setup-python@v6"

        with:
          python-version: "${{ matrix.python-version }}"
          allow-prereleases: true

      - name: "Install dependencies"
        run: |
          python -VV
          python -m site
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install --upgrade coverage[toml] virtualenv tox tox-gh-actions

      - name: "Run tox targets for ${{ matrix.python-version }}"
        run: "python -m tox -- ${{ inputs.test-filter }}"

      # We always use a modern Python version for combining coverage to prevent
      # parsing errors in older versions for modern code.
      - uses: "actions/setup-python@v6"
        with:
          python-version: "3.9"

      - name: "Combine coverage"
        run: |
          set -xe
          python -m pip install coverage[toml]
          python -m coverage combine
          python -m coverage xml
        if: "contains(env.USING_COVERAGE, matrix.python-version) && matrix.platform == 'ubuntu-latest'"

  package:
    name: "Build & verify package"
    runs-on: "ubuntu-latest"
    timeout-minutes: 30

    steps:
      - uses: "actions/checkout@v6"
      - uses: "actions/setup-python@v6"

        with:
          python-version: "3.9"

      - name: "Install build and twine"
        run: 'python -m pip install "setuptools==80.10.2" build twine'

      - name: "Remove standalone wheel distribution"
        run: |
          if python -m pip show wheel >/dev/null 2>&1; then python -m pip uninstall -y wheel; fi

      - name: "Build package"
        run: "python -m build --no-isolation"

      - name: "Check wheel Generator"
        run: "unzip -p dist/*.whl '*.dist-info/WHEEL' | grep -qx 'Generator: setuptools (80.10.2)'"

      - name: "List result"
        run: "ls -l dist"

      - name: "Check long_description"
        run: "python -m twine check dist/*"

      - uses: "actions/upload-artifact@v4"
        with:
          name: "dist"
          path: "dist/*"
          if-no-files-found: "error"

  install-dev:
    strategy:
      matrix:
        os: ["ubuntu-latest", "windows-latest", "macos-latest"]

    name: "Verify dev env"
    runs-on: "${{ matrix.os }}"
    timeout-minutes: 30

    steps:
      - uses: "actions/checkout@v6"
      - uses: "actions/setup-python@v6"

        with:
          python-version: "3.9"

      - name: "Install in dev mode"
        run: "python -m pip install -e .[dev]"

      - name: "Import package"
        run: "python -c 'import jwt; print(jwt.__version__)'"
